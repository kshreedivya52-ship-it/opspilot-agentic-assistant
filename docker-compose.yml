services:
  postgres:
    image: postgres:16
    container_name: opspilot-postgres
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot_pass
      POSTGRES_DB: opspilot
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: opspilot-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: opspilot
      MONGO_INITDB_ROOT_PASSWORD: opspilot_pass
    ports:
      - '27017:27017'
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7
    container_name: opspilot-redis
    ports:
      - '6379:6379'

volumes:
  pgdata:
  mongodata:
